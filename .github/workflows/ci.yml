name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar backend
        run: python -m pip install -r backend/requirements.txt

      - name: Testar backend
        run: python -m pytest backend/tests -q

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar frontend pelo lockfile
        working-directory: frontend
        run: npm ci

      - name: Testar frontend
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Compilar frontend
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

  database:
    name: PostgreSQL, migrations e RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Recriar banco pelas migrations
        run: supabase db start

      - name: Executar testes pgTAP
        run: supabase test db

      - name: Analisar schema PostgreSQL
        run: supabase db lint --level error

      - name: Diagnóstico dos serviços em caso de falha
        if: failure()
        run: supabase status || true

